<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Precision Editor Pro - Camera Fix</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
    #overlay {
      position: absolute; top: 10px; left: 10px; z-index: 100;
      background: rgba(0,0,0,0.9); color: white; padding: 20px;
      border-radius: 10px; width: 340px; border: 1px solid #444;
      pointer-events: auto;
    }
    .code-box {
      background: #000; color: #0f0; padding: 10px; font-family: monospace;
      font-size: 11px; margin-top: 10px; border-radius: 5px; white-space: pre-wrap;
      border: 1px solid #333; min-height: 50px;
    }
    .guide { font-size: 11px; color: #aaa; line-height: 1.5; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
    .kbd { background: #333; padding: 2px 4px; border-radius: 3px; color: #fff; font-family: monospace; font-size: 10px; }
    h4 { margin: 0 0 5px 0; color: #fff; text-transform: uppercase; font-size: 13px; }
    .input-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
    .input-group input { background: #222; color: #fff; border: 1px solid #555; padding: 5px; text-align: center; border-radius: 3px; }
  </style>
</head>
<body>

  <div id="overlay">
    <h4>Ultra-Precision Editor</h4>
    <p style="font-size: 11px; color: #00ff00; margin: 0;">FIX: ARROW KEYS LOCKED TO ASSET</p>
    
    <div class="input-group">
      <input type="number" id="posX" step="0.01" placeholder="X">
      <input type="number" id="posY" step="0.01" placeholder="Y">
      <input type="number" id="posZ" step="0.01" placeholder="Z">
    </div>

    <div class="guide">
      <b>🎥 KAMERA:</b> <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> (Jalan) | <b>Mouse:</b> Lihat<br>
      <b>🚀 ASSET:</b> Tombol Panah <span class="kbd">←↑→↓</span> (Geser)<br>
      <span class="kbd">Shift</span> + <span class="kbd">↑</span> / <span class="kbd">↓</span> : Naik / Turun<br>
      <span class="kbd">J</span> / <span class="kbd">L</span> : Putar | <span class="kbd">+</span> / <span class="kbd">-</span> : Skala<br>
      <span class="kbd">R</span> : <b>RESET POSISI</b>
    </div>
    
    <div style="margin-top:15px;">
      <h4>Preview Kode:</h4>
      <div id="output-code" class="code-box">Klik objek di layar...</div>
    </div>
  </div>

  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .targetable">
    <a-assets>
      <a-asset-item id="modelKaaba" src="./assets/kaaba.glb"></a-asset-item>
      <img id="char0" src="./assets/char-wear_ihram.png">
    </a-assets>

    <a-entity id="rig" position="0 1.6 4" wasd-controls="acceleration: 20; fly: false;">
      <a-entity camera look-controls="pointerLockEnabled: false"></a-entity>
    </a-entity>

    <a-entity id="cardGroup">
        <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#fff" opacity="0.1"></a-plane>
        <a-grid position="0 0.01 0" geometry="size: 20; spacing: 0.5" material="color: #444; opacity: 0.4"></a-grid>

        <a-entity id="arAsets">
            <a-entity id="objVisual" class="targetable" 
                      gltf-model="#modelKaaba" 
                      geometry="primitive: box; width: 0.5; height: 0.5; depth: 0.5"
                      material="color: red; opacity: 0.3"
                      position="0 0.5 0" rotation="0 0 0" scale="1 1 1">
            </a-entity>

            <a-image id="imgVisual" class="targetable" src="#char0" position="0.5 0.5 0.1" width="0.6" height="0.9"></a-image>
        </a-entity>
    </a-entity>

    <a-light type="ambient" intensity="1.2"></a-light>
  </a-scene>

  <script>
    let selectedEl = null;
    const outputBox = document.getElementById('output-code');

    // Matikan fungsi panah pada wasd-controls secara manual agar tidak konflik
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        // Jika sedang mengedit objek, cegah event panah sampai ke kamera
        if (selectedEl) {
          e.preventDefault(); 
        }
      }
    }, true);

    window.addEventListener('DOMContentLoaded', () => {
      fetch('/load-coords').then(res => res.json()).then(data => {
        const obj = document.getElementById('objVisual');
        const img = document.getElementById('imgVisual');
        if (data.kaaba) {
          obj.setAttribute('position', data.kaaba.pos);
          obj.setAttribute('rotation', data.kaaba.rot);
          obj.setAttribute('scale', data.kaaba.scl);
        }
        if (data.karakter) {
          img.setAttribute('position', data.karakter.pos);
          img.setAttribute('rotation', data.karakter.rot);
        }
      });
    });

    function save() {
      if (!selectedEl) return;
      const pos = selectedEl.getAttribute('position');
      const rot = selectedEl.getAttribute('rotation');
      const scl = selectedEl.getAttribute('scale') || {x:1, y:1, z:1};
      const idTarget = selectedEl.id === 'objVisual' ? 'kaaba0' : 'karakter0';

      document.getElementById('posX').value = pos.x.toFixed(2);
      document.getElementById('posY').value = pos.y.toFixed(2);
      document.getElementById('posZ').value = pos.z.toFixed(2);

      const p = `${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}`;
      const r = `${Math.round(rot.x)} ${Math.round(rot.y)} ${Math.round(rot.z)}`;
      const s = `${scl.x.toFixed(2)} ${scl.y.toFixed(2)} ${scl.z.toFixed(2)}`;

      outputBox.innerText = `<a-entity id="${idTarget}" position="${p}" rotation="${r}" scale="${s}"></a-entity>`;

      fetch('/save-coords', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: idTarget, position: p, rotation: r, scale: s })
      });
    }

    document.querySelectorAll('.targetable').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedEl = el;
        document.querySelectorAll('.targetable').forEach(obj => obj.setAttribute('opacity', 0.5));
        if(el.tagName === 'A-IMAGE') el.setAttribute('opacity', 1);
        save();
      });
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT' || !selectedEl) return;

      let pos = selectedEl.getAttribute('position');
      let rot = selectedEl.getAttribute('rotation');
      let scl = selectedEl.getAttribute('scale') || {x:1, y:1, z:1};

      if (e.key.toLowerCase() === 'r') {
        pos = {x: 0, y: 0.5, z: 0};
        selectedEl.setAttribute('position', pos);
        save(); return;
      }

      // Geser Aset (Panah) - Kamera tidak akan ikut bergerak karena preventDefault di atas
      if (e.key === 'ArrowLeft') pos.x -= 0.05;
      if (e.key === 'ArrowRight') pos.x += 0.05;
      if (!e.shiftKey && e.key === 'ArrowUp') pos.z -= 0.05;
      if (!e.shiftKey && e.key === 'ArrowDown') pos.z += 0.05;
      if (e.shiftKey && e.key === 'ArrowUp') pos.y += 0.05;
      if (e.shiftKey && e.key === 'ArrowDown') pos.y -= 0.05;

      if (e.key.toLowerCase() === 'j') rot.y -= 5;
      if (e.key.toLowerCase() === 'l') rot.y += 5;
      if (e.key === '=' || e.key === '+') { scl.x += 0.05; scl.y += 0.05; scl.z += 0.05; }
      if (e.key === '-' || e.key === '_') { scl.x -= 0.05; scl.y -= 0.05; scl.z -= 0.05; }

      selectedEl.setAttribute('position', pos);
      selectedEl.setAttribute('rotation', rot);
      selectedEl.setAttribute('scale', scl);
      save();
    });
  </script>
</body>
</html>
