<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSU FYP - Interactive Umrah AR</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    /* Layar loading estetik sebelum kamera HP aktif */
    #mindar-ui-loading { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 999; 
      font-family: sans-serif; color: white; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; 
    }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; uiLoading: #mindar-ui-loading;" 
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.4.3/;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="modelMasjid" src="./assets/kaaba.glb"></a-asset-item>
      
      <img id="charWearIhram" src="./assets/char-wear_ihram.png">
      <img id="charEnterMasjid" src="./assets/char-enter_masjid.png">
      <img id="charFirstSight" src="./assets/char-first_sight_of_kaaba.png">
      <img id="charNiat" src="./assets/char-make_intentions.png">
      <img id="charReciteTalbiyah" src="./assets/char-recite_talbiyah.png">
    </a-assets>

    <a-camera id="kameraUser" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#modelMasjid" position="0 0 0" scale="0.05 0.05 0.05"></a-gltf-model>
      <a-image src="#charWearIhram" position="0.2 0.4 0.1" width="0.6" height="0.9" look-at="#kameraUser"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#modelMasjid" position="0 0 0" scale="0.05 0.05 0.05"></a-gltf-model>
      <a-image src="#charEnterMasjid" position="0.2 0.4 0.1" width="0.6" height="0.9" look-at="#kameraUser"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model src="#modelMasjid" position="0 0 0" scale="0.05 0.05 0.05"></a-gltf-model>
      <a-image src="#charFirstSight" position="0.2 0.4 0.1" width="0.6" height="0.9" look-at="#kameraUser"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model src="#modelMasjid" position="0 0 0" scale="0.05 0.05 0.05"></a-gltf-model>
      <a-image src="#charNiat" position="0.2 0.4 0.1" width="0.6" height="0.9" look-at="#kameraUser"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
      <a-gltf-model src="#modelMasjid" position="0 0 0" scale="0.05 0.05 0.05"></a-gltf-model>
      <a-image src="#charReciteTalbiyah" position="0.2 0.4 0.1" width="0.6" height="0.9" look-at="#kameraUser"></a-image>
    </a-entity>

  </a-scene>

</body>
</html>
